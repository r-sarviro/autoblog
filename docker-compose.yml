services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: auto-blog-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_NAME: AUTO-BLOG
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: auto_blog
      DB_USERNAME: auto_blog
      DB_PASSWORD: secret
      PER_PAGE: 12
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: auto-blog-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: auto-blog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auto_blog
      MYSQL_USER: auto_blog
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - auto_blog_db:/var/lib/mysql
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  auto_blog_db:
